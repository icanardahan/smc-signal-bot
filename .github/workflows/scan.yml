name: ICT 2022 Sinyal Taraması

on:
  schedule:
    # Saatlik: kurulumlar 5 dakikalık grafikte oluşuyor, 4 saatte bir taramak
    # girişlerin kaçmasına yol açıyordu. Repo public olduğu için Actions
    # dakikası ücretsiz ve sınırsız.
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ICT 2022 taramasını çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ict_scanner.py

      - name: Durumu (ict_state.json) kaydet
        run: |
          git config user.name "ict-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- ict_state.json; then
            git add ict_state.json
            git commit -m "state güncelle"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push başarısız, tekrar deneniyor ($i)..."
              sleep 5
            done
          else
            echo "state değişmedi, commit atlanıyor."
          fi
