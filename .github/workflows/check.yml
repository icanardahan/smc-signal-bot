name: Binance bağlantı tanılaması

# Sadece elle tetiklenir. Saniyeler sürer — tam taramayı beklemeden
# API anahtarı, adres ve bakiye okumasını doğrulamak için.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Emir tiplerini de dene (açık pozisyon gerekir)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Canlı Binance uçlarına erişim (imzasız)
        run: |
          for h in fapi.binance.com fapi1.binance.com fapi2.binance.com \
                   fapi3.binance.com fapi4.binance.com api.binance.com \
                   api-gcp.binance.com testnet.binancefuture.com \
                   data-api.binance.vision; do
            case "$h" in
              *binancefuture*|fapi*) yol=/fapi/v1/time ;;
              *) yol=/api/v3/time ;;
            esac
            printf "%-30s " "$h"
            kod=$(curl -s -m 12 -o /dev/null -w "%{http_code}" "https://$h$yol" || echo "---")
            son=$(curl -sL -m 15 -o /dev/null -w "%{http_code} -> %{url_effective}" "https://$h$yol" || echo "---")
            echo "HTTP $kod | yönlendirme sonrası: $son"
            if [ "$kod" = "451" ]; then
              echo "      GOVDE: $(curl -s -m 12 "https://$h$yol" | tr -d "\n" | head -c 300)"
            fi
          done

      - name: Bağlantıyı sına
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TRADING_ENABLED: ${{ vars.BINANCE_TRADING_ENABLED }}
          BINANCE_TESTNET: ${{ vars.BINANCE_TESTNET || '1' }}
          BINANCE_DRY_RUN: ${{ vars.BINANCE_DRY_RUN || '1' }}
        run: python check_binance.py

      - name: Emir tipi denemesi
        if: ${{ inputs.probe == true }}
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TRADING_ENABLED: ${{ vars.BINANCE_TRADING_ENABLED }}
          BINANCE_TESTNET: ${{ vars.BINANCE_TESTNET || '1' }}
          BINANCE_DRY_RUN: '0'
        run: python probe_order.py
