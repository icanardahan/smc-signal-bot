name: SMC H/G/4S Taraması (ileri test)

# Bu strateji KANITLANMIŞ DEĞİLDİR — amaç ileri test.
# Backtest'te (2 yıl, 40 sembol, sabit evren, sadece long, sürüklenen stop)
# +0.240R / t=2.33 ölçüldü; ancak çok sayıda varyant denendiği için bu tek
# başına kanıt sayılmaz ve 2026 dilimi eksidir. Bu yüzden görülmemiş veriyle
# ileri test ediliyor.

# ZAMANLAMA KAPALI. Bot artık kullanıcının Mac'inde çalışıyor (run_local.sh +
# launchd), çünkü Binance'in GERÇEK vadeli ucu Actions'tan HTTP 451 veriyor.
# Buradan da çalışsaydı iki ayrı yazıcı olurdu: state çakışır, Telegram'a
# çift mesaj giderdi. Elle çalıştırma yalnızca testnet tanılaması için durur.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SMC taramasını çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- Otomatik işlem ---
          # Anahtarlar Secrets'ta, loglara asla yazılmaz.
          # GERÇEK PARA için repo Variables:
          #   BINANCE_TRADING_ENABLED=1
          #   BINANCE_TESTNET=0        <-- 0 = GERÇEK PARA
          #   BINANCE_DRY_RUN=0
          # Varsayılanlar bilerek güvenli tarafta: değişken yoksa testnet
          # ve kuru çalışma açık, yani emir gitmez.
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TRADING_ENABLED: ${{ vars.BINANCE_TRADING_ENABLED }}
          BINANCE_TESTNET: ${{ vars.BINANCE_TESTNET || '1' }}
          BINANCE_DRY_RUN: ${{ vars.BINANCE_DRY_RUN || '1' }}
          # Boş bırakılırsa koddaki varsayılan (5) geçerli olur; workflow'da
          # sabit bir yedek yazmak kod varsayılanını sessizce eziyordu.
          SMC_MAX_OPEN: ${{ vars.SMC_MAX_OPEN }}
          SMC_RISK_PCT: ${{ vars.SMC_RISK_PCT || '2.0' }}
        run: python smc_scanner.py

      # Tarama çökerse sessiz kalmasın: bu oturumda sessiz hatalar (yanlış algo
      # yolu, hiç commit edilmeyen state) ancak logu elle okuyunca fark edildi.
      - name: Çökerse Telegram'a bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          t = os.environ.get("TELEGRAM_BOT_TOKEN"); c = os.environ.get("TELEGRAM_CHAT_ID")
          if t and c:
              msg = ("🚨 <b>SMC taraması BAŞARISIZ</b>\n"
                     "Bu koşuda sinyal üretilmedi.\n" + os.environ.get("RUN_URL", ""))
              d = json.dumps({"chat_id": c, "text": msg, "parse_mode": "HTML"}).encode()
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{t}/sendMessage", data=d,
                  headers={"Content-Type": "application/json"}), timeout=15).read()
          PY

      - name: Durumu (smc_state.json) kaydet
        run: |
          git config user.name "smc-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          # ÖNCE add, SONRA karşılaştır: `git diff` takip edilmeyen dosyayı
          # görmez, dolayısıyla state ilk kez oluştuğunda "değişmedi" sanılır ve
          # commit edilmezdi. O durumda bot bir sonraki koşuda açık emri unutup
          # aynı emri ikinci kez açardı.
          [ -f smc_state.json ] && git add smc_state.json
          if ! git diff --cached --quiet; then
            git commit -m "smc state güncelle"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push başarısız, tekrar deneniyor ($i)..."
              sleep 5
            done
          else
            echo "state değişmedi, commit atlanıyor."
          fi
