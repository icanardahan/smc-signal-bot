name: SMC H/G/4S Taraması (ileri test)

# Bu strateji KANITLANMIŞ DEĞİLDİR — amaç ileri test.
# Backtest'te (2 yıl, 40 sembol, sabit evren, sadece long, sürüklenen stop)
# +0.240R / t=2.33 ölçüldü; ancak çok sayıda varyant denendiği için bu tek
# başına kanıt sayılmaz ve 2026 dilimi eksidir. Bu yüzden görülmemiş veriyle
# ileri test ediliyor.

on:
  schedule:
    # Saatlik. Kurulumlar 4 saatlik barlarda oluşuyor ama bekleyen emrin
    # dolumunu ve stop sürüklemesini erken bildirmek için saatlik taranıyor.
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SMC taramasını çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- Otomatik işlem (varsayılan KAPALI) ---
          # Testnet ileri testi için repo Variables'a şunları ekle:
          #   BINANCE_TRADING_ENABLED=1
          #   BINANCE_TESTNET=1
          #   BINANCE_DRY_RUN=0
          # Anahtarlar Secrets'ta tutulur, loglara asla yazılmaz.
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BINANCE_TRADING_ENABLED: ${{ vars.BINANCE_TRADING_ENABLED }}
          BINANCE_TESTNET: ${{ vars.BINANCE_TESTNET || '1' }}
          BINANCE_DRY_RUN: ${{ vars.BINANCE_DRY_RUN || '1' }}
          SMC_MAX_OPEN: ${{ vars.SMC_MAX_OPEN || '5' }}
          SMC_RISK_PCT: ${{ vars.SMC_RISK_PCT || '2.0' }}
        run: python smc_scanner.py

      - name: Durumu (smc_state.json) kaydet
        run: |
          git config user.name "smc-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          # ÖNCE add, SONRA karşılaştır: `git diff` takip edilmeyen dosyayı
          # görmez, dolayısıyla state ilk kez oluştuğunda "değişmedi" sanılır ve
          # commit edilmezdi. O durumda bot bir sonraki koşuda açık emri unutup
          # aynı emri ikinci kez açardı.
          [ -f smc_state.json ] && git add smc_state.json
          if ! git diff --cached --quiet; then
            git commit -m "smc state güncelle"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push başarısız, tekrar deneniyor ($i)..."
              sleep 5
            done
          else
            echo "state değişmedi, commit atlanıyor."
          fi
